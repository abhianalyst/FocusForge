name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name FocusForge --collect-all PySide6 --collect-all shiboken6 main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null

          $candidatePaths = @(
            (Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ChocolateyInstall "lib\innosetup\tools\ISCC.exe")
          )

          $iscc = $candidatePaths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if (-not $iscc) {
            Write-Host "Could not locate ISCC.exe. Checked:"
            $candidatePaths | ForEach-Object { Write-Host " - $_" }
            Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "Inno Setup*" } |
              ForEach-Object { Get-ChildItem $_.FullName -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue }
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }

          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: FocusForge-Windows-Installer
          path: release/FocusForge_Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FocusForge-Windows-Portable
          path: dist/FocusForge/
